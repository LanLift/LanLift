name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build web bundle
        run: pnpm build:web
      - name: Test with coverage
        run: |
          node --test --experimental-test-coverage test/*.test.js | tee /tmp/coverage.txt
          grep -E 'all files' /tmp/coverage.txt
